{% extends "gestion/base.html" %}

{% block title %}Eliminar cliente - Alke Wallet{% endblock %}

{% block content %}

<div class="card">

    <h2>Eliminar cliente</h2>

    <p>
        ¿Estás seguro de que deseas eliminar al cliente
        <strong>{{ object.nombre }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Sí, eliminar
        </button>

        <a href="{% url 'cliente-list' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>

</div>

{% endblock %}
